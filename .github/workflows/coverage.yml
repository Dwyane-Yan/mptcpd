name: Coverage

on: ["push", "pull_request"]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt-get -y install autoconf-archive lcov git libell-dev
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure --enable-code-coverage
    - name: make
      run: make -j$(nproc)
    - name: make check
      run: make check || { cat tests/test-suite.log; exit 1; }
    - name: sudo make check
      run: sudo make check || { cat tests/test-suite.log; exit 1; }
    - name: dump per-test log
      if: always()
      run: cat tests/test-e2e-addr-adv.log
